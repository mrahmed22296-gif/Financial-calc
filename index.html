<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="docTitle">حاسبة مستحقات نهاية الخدمة ورصيد الإجازات - الكويت</title>
    <meta name="google-site-verification" content="FXZ-FC-GjUusN1XRGb26hz2nm7OJjgYketoHVOgJi2Y" />
    <meta name="description" content="حاسبة دقيقة لاحتساب مستحقات نهاية الخدمة ورصيد الإجازات في الكويت وفقاً لقانون العمل الكويتي.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبة تصدير الإكسل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --paper: #EDF1E6;
            --paper-line: #C7D6C4;
            --ink: #1C2620;
            --green: #2F5233;
            --accent: #D96B27;
            --card-bg: #F4F7F2;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--paper);
            color: var(--ink);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            border: 2px solid var(--paper-line);
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
        }

        h2 {
            color: var(--green);
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .note {
            background-color: #E8F0E6;
            border-right: 4px solid var(--green);
            padding: 10px 15px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--paper-line);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            background-color: var(--card-bg);
        }

        input:focus, select:focus {
            border-color: var(--green);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--green);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #233e26;
        }

        .result-card {
            margin-top: 25px;
            padding: 20px;
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--paper-line);
            display: none;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 1.05rem;
        }

        .result-item.total {
            border-top: 2px dashed var(--paper-line);
            padding-top: 12px;
            font-weight: 700;
            color: var(--accent);
            font-size: 1.2rem;
        }

        .btn-export {
            background-color: var(--accent);
            margin-top: 15px;
        }

        .btn-export:hover {
            background-color: #b5541a;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>حاسبة المستحقات (الكويت)</h2>
    
    <div class="note">
        💡 يمكنك حساب <b>رصيد الإجازات فقط</b> بإدخال الراتب والأيام، أو حساب <b>نهاية الخدمة فقط</b> بإدخال التواريخ والراتب، أو حسابهما معاً.
    </div>

    <form id="calcForm">
        <div class="form-group">
            <label for="salary">الراتب الاجمالي (دينار كويتي) *</label>
            <input type="number" id="salary" placeholder="أدخل الراتب الإجمالي" step="any" required>
        </div>

        <div class="form-group">
            <label for="reason">سبب انتهاء الخدمة</label>
            <select id="reason">
                <option value="resignation">استقالة</option>
                <option value="termination">إنهاء خدمة (تأفيض/إقالة)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="startDate">تاريخ بداية الخدمة (اختياري لحساب مكافأة نهاية الخدمة)</label>
            <input type="date" id="startDate">
        </div>

        <div class="form-group">
            <label for="endDate">تاريخ نهاية الخدمة (اختياري لحساب مكافأة نهاية الخدمة)</label>
            <input type="date" id="endDate">
        </div>

        <div class="form-group">
            <label for="leaveDays">رصيد الإجازات المتبقي بالأيام (اختياري)</label>
            <input type="number" id="leaveDays" placeholder="أدخل عدد الأيام" min="0" step="any">
        </div>

        <button type="button" class="btn" onclick="calculate()">احسب الآن</button>
    </form>

    <div class="result-card" id="resultCard">
        <div class="result-item" id="eosRow">
            <span>مكافأة نهاية الخدمة:</span>
            <span id="eosAmount">0 د.ك</span>
        </div>
        <div class="result-item" id="leaveRow">
            <span>بدل رصيد الإجازات:</span>
            <span id="leaveAmount">0 د.ك</span>
        </div>
        <div class="result-item total">
            <span>إجمالي المستحقات:</span>
            <span id="totalAmount">0 د.ك</span>
        </div>

        <button type="button" class="btn btn-export" onclick="exportToExcel()">تصدير النتيجة إلى Excel 📊</button>
    </div>
</div>

<script>
    function calculate() {
        const salary = parseFloat(document.getElementById('salary').value);
        const reason = document.getElementById('reason').value;
        const startDateVal = document.getElementById('startDate').value;
        const endDateVal = document.getElementById('endDate').value;
        const leaveDays = parseFloat(document.getElementById('leaveDays').value) || 0;

        if (!salary || salary <= 0) {
            alert('يرجى إدخال الراتب الإجمالي بشكل صحيح.');
            return;
        }

        let eosAmount = 0;
        let leaveAmount = 0;
        const dailyRate = salary / 26; // الأجر اليومي وفق قانون العمل الكويتي

        // 1. حساب بدل رصيد الإجازات
        if (leaveDays > 0) {
            leaveAmount = leaveDays * dailyRate;
        }

        // 2. حساب مكافأة نهاية الخدمة (إذا أدخل التواريخ)
        if (startDateVal && endDateVal) {
            const startDate = new Date(startDateVal);
            const endDate = new Date(endDateVal);

            if (endDate <= startDate) {
                alert('تاريخ نهاية الخدمة يجب أن يكون بعد تاريخ البداية.');
                return;
            }

            // حساب أمد الخدمة بالسنوات
            const diffTime = Math.abs(endDate - startDate);
            const totalDays = diffTime / (1000 * 60 * 60 * 24);
            const totalYears = totalDays / 365.25;

            // حساب المستحق الأساسي (15 يوماً للـ 5 سنوات الأولى، وشهر لما بعد ذلك)
            let baseReward = 0;
            if (totalYears <= 5) {
                baseReward = totalYears * (15 * dailyRate);
            } else {
                const first5Years = 5 * (15 * dailyRate);
                const remainingYears = (totalYears - 5) * (30 * dailyRate);
                baseReward = first5Years + remainingYears;
            }

            // الحد الأقصى للمكافأة هو راتب 18 شهراً
            const maxReward = salary * 18;
            if (baseReward > maxReward) {
                baseReward = maxReward;
            }

            // تطبيق نسبة الاستقالة إن وجدت
            if (reason === 'resignation') {
                if (totalYears < 3) {
                    eosAmount = 0; // أقل من 3 سنوات لا يستحق مكافأة عند الاستقالة
                } else if (totalYears >= 3 && totalYears < 5) {
                    eosAmount = baseReward * (1 / 3); // يستحق ثلث المكافأة
                } else if (totalYears >= 5 && totalYears < 10) {
                    eosAmount = baseReward * (2 / 3); // يستحق ثلثي المكافأة
                } else {
                    eosAmount = baseReward; // 10 سنوات فأكثر يستحق المكافأة كاملة
                }
            } else {
                // إنهاء الخدمة يستحق المكافأة كاملة
                eosAmount = baseReward;
            }
        }

        // عرض النتائج
        document.getElementById('eosAmount').innerText = eosAmount.toFixed(3) + ' د.ك';
        document.getElementById('leaveAmount').innerText = leaveAmount.toFixed(3) + ' د.ك';
        document.getElementById('totalAmount').innerText = (eosAmount + leaveAmount).toFixed(3) + ' د.ك';

        document.getElementById('resultCard').style.display = 'block';
    }

    function exportToExcel() {
        const salary = document.getElementById('salary').value;
        const eos = document.getElementById('eosAmount').innerText;
        const leave = document.getElementById('leaveAmount').innerText;
        const total = document.getElementById('totalAmount').innerText;

        const data = [
            ["البيان", "القيمة"],
            ["الراتب الإجمالي", salary + " د.ك"],
            ["مكافأة نهاية الخدمة", eos],
            ["بدل رصيد الإجازات", leave],
            ["إجمالي المستحقات", total]
        ];

        const ws = XLSX.utils.aoa_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "تفاصيل المستحقات");

        XLSX.writeFile(wb, "حساب_المستحقات_الكويت.xlsx");
    }
</script>

</body>
</html>
